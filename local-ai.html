<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOC Review | Local AI</title><link rel="stylesheet" href="/style.css"><body><main style="max-width:850px;margin:40px auto;padding:24px"><a href="/">Back to SOC Review</a><h1>Local AI draft lab</h1><p>Synthetic alerts only. Ollama runs on this PC. Model drafts require human verification; evidence ID validation does not establish factual correctness.</p><label for="alert">Synthetic alert</label><select id="alert"></select><button class="button" id="generate">Generate draft</button><p id="status" role="status"></p><pre id="result" style="white-space:pre-wrap;background:white;padding:24px"></pre><script type="module">
import {alerts} from '/engine.js';
const select=document.querySelector('#alert'),button=document.querySelector('#generate'),status=document.querySelector('#status'),result=document.querySelector('#result');
for(const alert of alerts){const option=document.createElement('option');option.value=alert.id;option.textContent=alert.id+' '+alert.title;select.append(option);}
button.onclick=async()=>{button.disabled=true;result.textContent='';status.textContent='Generating locally. This may take up to 90 seconds.';try{const response=await fetch('/api/draft?id='+encodeURIComponent(select.value),{method:'POST'});const data=await response.json();if(!response.ok)throw Error(data.error);result.textContent=JSON.stringify(data,null,2);status.textContent='Draft ready for human review. No action has been taken.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></main></body></html>
